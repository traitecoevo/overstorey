name: PR checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  freeze-consistency:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }

      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-renv@v2

      # Freeze-consistency guard. NOTE: --no-execute-daemon does NOT prevent
      # execution — it only disables the persistent knitr/jupyter kernel.
      # The real guard is `freeze: auto` + the git diff below: if a source
      # changed without a committed _freeze/ update, this render re-executes
      # it, _freeze/ changes, and the diff fails the build — forcing the
      # author to run `quarto render` locally and commit the fresh freeze.
      - name: Check freeze is up to date
        run: |
          quarto render --no-execute-daemon || true
          # After render, _freeze/ should be unchanged vs the committed tree.
          if ! git diff --quiet -- _freeze/; then
            echo "::error::_freeze/ is out of date with sources."
            echo "Run 'quarto render' locally and commit the updated _freeze/."
            git --no-pager diff --stat -- _freeze/
            exit 1
          fi
          echo "_freeze/ is consistent with sources."

  reproduction-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::yaml
      - name: No unfilled reproductions
        run: Rscript R/check_reproductions.R

  # The theory-page version stamp (_variables.yml) is derived from the plant
  # pin in renv.lock. Regenerate it and fail if the committed copy is stale, so
  # bumping the pin can't silently leave the docs stamping an old version.
  variables-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::jsonlite
      - name: _variables.yml matches renv.lock
        run: |
          Rscript R/sync_plant_vars.R
          if ! git diff --quiet -- _variables.yml; then
            echo "::error::_variables.yml is out of date with renv.lock's plant pin."
            echo "Run 'Rscript R/sync_plant_vars.R' and commit the result."
            git --no-pager diff -- _variables.yml
            exit 1
          fi
          echo "_variables.yml is consistent with renv.lock."
